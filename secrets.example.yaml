# Merge these entries into your existing ESPHome secrets.yaml.
# Do not replace existing entries used by your other devices.
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# Generate a fresh 32-byte base64 key: openssl rand -base64 32
# Or retain the API encryption key generated by ESPHome Device Builder.
guition_api_key: "PASTE_YOUR_32_BYTE_BASE64_KEY_HERE"

# At least 8 characters; protects the fallback Wi-Fi setup access point.
guition_fallback_password: "CHANGE_THIS_TO_A_UNIQUE_PASSWORD"
